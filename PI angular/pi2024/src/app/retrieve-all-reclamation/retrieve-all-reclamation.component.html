<table mat-table [dataSource]="reclamations">

  <!-- Reclamation ID Column -->
  <ng-container matColumnDef="reclamationId">
    <th mat-header-cell *matHeaderCellDef> Reclamation ID </th>
    <td mat-cell *matCellDef="let reclamation"> {{ reclamation.reclamationId }} </td>
  </ng-container>

  <!-- Description Column -->
  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef> Description </th>
    <td mat-cell *matCellDef="let reclamation"> {{ reclamation.description }} </td>
  </ng-container>

  <!-- Reason Column -->
  <ng-container matColumnDef="reason">
    <th mat-header-cell *matHeaderCellDef> Reason </th>
    <td mat-cell *matCellDef="let reclamation"> {{ reclamation.reason }} </td>
  </ng-container>

  <!-- Status Column -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> Status </th>
    <td mat-cell *matCellDef="let reclamation"> {{ reclamation.status }} </td>
  </ng-container>

  <!-- Date Submitted Column -->
  <ng-container matColumnDef="dateSubmitted">
    <th mat-header-cell *matHeaderCellDef> Date Submitted </th>
    <td mat-cell *matCellDef="let reclamation"> {{ reclamation.dateSubmitted }} </td>
  </ng-container>

  <!-- Date Updated Column -->
  <ng-container matColumnDef="dateUpdated">
    <th mat-header-cell *matHeaderCellDef> Date Updated </th>
    <td mat-cell *matCellDef="let reclamation"> {{ reclamation.dateUpdated }} </td>
  </ng-container>
  <!-- Delete Column -->
  <ng-container matColumnDef="delete">
    <th mat-header-cell *matHeaderCellDef> Delete </th>
    <td mat-cell *matCellDef="let reclamation">
      <button mat-icon-button (click)="deleteReclamation(reclamation.reclamationId)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>

  </ng-container>
  <ng-container matColumnDef="update">
    <th mat-header-cell *matHeaderCellDef>  </th>
    <td mat-cell *matCellDef="let reclamation">
      
    </td>
  </ng-container>
  <!-- Define the columns to display -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>


</table>
